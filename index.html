<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simba Building Materials | Order Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header
<option>M-Pesa</option>
<option>Discuss with the seller</option>
</select>

<label>Additional Instructions</label>
<textarea id="notes" placeholder="Any other details about your order"></textarea>

<p class="small">Submitting this form requests a quotation. Your order is not confirmed until the seller confirms availability, prices, delivery charges, and payment instructions.</p>

<button type="button" onclick="sendWhatsApp()">Send Order via WhatsApp</button>
<button type="button" onclick="sendEmail()">Send Order via Email</button>
</form>
</section>

<section class="card" id="contact">
<h2>Contact Us</h2>
<p><strong>WhatsApp:</strong> +254743721138</p>
<p><strong>Email:</strong> tutudesmond877@gmail.com</p>
<p>Contact us to confirm product prices, stock availability, delivery charges, and M-Pesa payment instructions.</p>
</section>
</main>

<footer>
<p>© 2026 Simba Building Materials Ordering Service</p>
<p>Independent building materials agent.</p>
</footer>

<script>
function getOrder(){
const fields = [
["Customer", "name"],
["Phone", "phone"],
["Email", "email"],
["Product", "product"],
["Quantity", "quantity"],
["County", "county"],
["Town/Area", "town"],
["Delivery address", "address"],
["Preferred delivery date", "date"],
["Delivery option", "delivery"],
["Payment method", "payment"],
["Additional instructions", "notes"]
];
return "BUILDING MATERIALS QUOTATION REQUEST\n\n" +
fields.map(([label,id]) => label + ": " +
(document.getElementById(id).value || "Not provided")).join("\n");
}
function sendWhatsApp(){
if(!document.getElementById("orderForm").reportValidity()) return;
const url = "https://wa.me/254743721138?text=" + encodeURIComponent(getOrder());
window.open(url, "_blank");
}
function sendEmail(){
if(!document.getElementById("orderForm").reportValidity()) return;
const subject = encodeURIComponent("Building Materials Quotation Request");
const body = encodeURIComponent(getOrder());
window.location.href = "mailto:tutudesmond877@gmail.com?subject=" + subject + "&body=" + body;
}
</script>

</body>
</html>
